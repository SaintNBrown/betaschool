spring:
  application:
    name: betaschool-backend

  datasource:
    url: ${${DATABASE_URL}:jdbc:postgresql://localhost:5432/betaschool}
    username: ${DB_USERNAME:betaschool}
    password: ${DB_PASSWORD:betaschool}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /api/v1

security:
  jwt:
    secret: ${JWT_SECRET:betaschool-super-secret-key-change-in-production-minimum-256-bits}
    expiration: 86400000   # 24 hours
    refresh-expiration: 604800000  # 7 days

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    com.betaschool: DEBUG
    org.springframework.security: DEBUG


cors:
  # Comma-separated list of allowed origins.
  # Override in production: CORS_ALLOWED_ORIGINS=https://yourapp.com
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from-address: ${MAIL_FROM_ADDRESS:noreply@betaschool.io}
    from-name: ${MAIL_FROM_NAME:BetaSchool}
    # Base URL used in reset links — override in production
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  password-reset:
    # How long a reset token is valid (minutes)
    token-expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:30}
